<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:transparent;color:#eaf2f5;font:15px/1.5 system-ui,sans-serif}.card{padding:26px;background:#111c24;border:1px solid #2a3c46;border-radius:20px;box-shadow:0 16px 40px #0002}h2{font-size:25px;letter-spacing:-.6px;margin:0 0 4px}.lead{color:#9bafb9;margin:0 0 20px;font-size:14px}.tabs{display:flex;background:#0b151c;padding:4px;border-radius:10px;margin-bottom:20px;gap:4px}.tabs button{flex:1;border:0;background:transparent;color:#a5b6c0;padding:10px;border-radius:7px;font:inherit;cursor:pointer}.tabs button[aria-selected=true]{background:#253c44;color:#8ce4d1;font-weight:650}.field{margin-bottom:15px}label{display:block;font-weight:550;font-size:14px;margin-bottom:7px}.input-wrap{position:relative}input{width:100%;height:46px;border:1px solid #3a4e59;border-radius:9px;background:#0d1820;padding:0 13px;color:#eef5f6;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}input[type=password],input[data-password]{padding-right:76px}input:focus{border-color:#73d9c3;box-shadow:0 0 0 3px #73d9c31b}input[aria-invalid=true]{border-color:#e79797}.visibility{position:absolute;right:7px;top:7px;min-height:32px;padding:3px 8px;border:0;border-radius:5px;background:transparent;color:#aac1ca;font-size:12px;cursor:pointer}button:focus-visible{outline:2px solid #7be0ca;outline-offset:3px}.error{color:#ffadad;font-size:13px;margin:6px 0 0}.error:empty{display:none}.rules{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 0;padding:0;list-style:none}.rules li{font-size:11px;color:#a6b8c2;padding:2px 7px;border-radius:5px;background:#20303a}.rules li.ok{color:#89e1c9;background:#193a34}.rules li.ok::before{content:'✓ '}.primary{width:100%;min-height:46px;margin-top:4px;border:0;border-radius:9px;background:#74dcc5;color:#082820;font:650 15px system-ui;cursor:pointer}.primary:hover{background:#91e7d3}.primary:disabled{opacity:.65;cursor:wait}.footnote{color:#859ca7;font-size:12px;text-align:center;margin:16px 0 0}.notice{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:15px;background:#193d34;color:#a4ebd1}.notice.failure{background:#3a252b;color:#ffb5b5}[hidden]{display:none!important}@media(max-width:480px){.card{padding:20px}}

/* Suppress Edge's own reveal control: one accessible visibility button per field. */
input::-ms-reveal,input::-ms-clear{display:none}
input[data-password]{padding-right:50px}
.visibility{width:36px;height:34px;display:grid;place-items:center;right:6px;top:6px;padding:0;transition:color .18s,background .18s}
.visibility:hover{color:#dcfff5;background:#73d9c315}.eye-slash{opacity:0;transition:opacity .15s}.visibility[aria-pressed=true] .eye-slash{opacity:1}
.tabs{position:relative;isolation:isolate}.tabs::before{content:'';position:absolute;inset:4px auto 4px 4px;width:calc((100% - 12px)/2);border-radius:7px;background:#253c44;z-index:-1;transition:transform .26s cubic-bezier(.22,1,.36,1)}.tabs[data-mode=register]::before{transform:translateX(calc(100% + 4px))}.tabs button[aria-selected=true]{background:transparent}.tabs button{transition:color .2s}
.card{overflow:hidden}.primary{transition:background .2s,box-shadow .2s,transform .15s}.primary:hover:not(:disabled){box-shadow:0 5px 18px #74dcc51c;transform:translateY(-1px)}.primary:active:not(:disabled){transform:translateY(0)}.rules li{transition:color .18s,background .18s}.correction{margin-top:7px;padding:0;border:0;background:none;color:#8be2cd;font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.notice,.error:not(:empty){animation:appear .18s ease-out}@keyframes appear{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<main class="card">
<h2 id="heading">Tekrar hoş geldin</h2><p class="lead" id="lead">Teknik destek çalışma alanına giriş yap.</p>
<div class="tabs" id="auth-tabs" data-mode="login" role="tablist" aria-label="Hesap işlemi"><button type="button" id="login-tab" role="tab" aria-selected="true" aria-controls="auth-form">Giriş yap</button><button type="button" id="register-tab" role="tab" aria-selected="false" aria-controls="auth-form">Hesap oluştur</button></div>
<div id="notice" role="status" class="notice" hidden></div>
<form id="auth-form" novalidate>
<div class="field"><label for="email">E-posta adresi</label><input id="email" type="email" autocomplete="username" placeholder="ad@firma.com" maxlength="254" aria-describedby="email-error"><p id="email-error" class="error" aria-live="polite"></p><button id="email-correction" class="correction" type="button" hidden></button></div>
<div class="field"><label for="password">Parola</label><div class="input-wrap"><input id="password" type="password" data-password autocomplete="current-password" maxlength="1024" aria-describedby="password-error rules"><button class="visibility" type="button" data-for="password" aria-label="Parolayı göster" aria-pressed="false"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m4 4 16 16"/></svg></button></div><p id="password-error" class="error" aria-live="polite"></p><ul id="rules" class="rules" aria-label="Parola gereksinimleri" hidden><li data-rule="length">8–1024 karakter</li><li data-rule="upper">Büyük harf</li><li data-rule="lower">Küçük harf</li><li data-rule="digit">Rakam</li></ul></div>
<div id="confirmation-field" class="field" hidden><label for="confirmation">Parolayı tekrar gir</label><div class="input-wrap"><input id="confirmation" type="password" data-password autocomplete="new-password" maxlength="1024" aria-describedby="confirmation-error"><button class="visibility" type="button" data-for="confirmation" aria-label="Parola tekrarını göster" aria-pressed="false"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m4 4 16 16"/></svg></button></div><p id="confirmation-error" class="error" aria-live="polite"></p></div>
<button id="submit" type="submit" class="primary">Giriş yap</button>
</form><p class="footnote">Sohbet geçmişin yalnızca mevcut oturumda tutulur.</p>
</main>
<script>
// Credentials are sent only on explicit submit; never persisted in browser storage.
const $=id=>document.getElementById(id);
let validTlds=null;
let mode='login',attempted=false,busy=false,lastEpoch=null,pendingId=null,touched=new Set();
const send=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
const resize=()=>send('streamlit:setFrameHeight',{height:Math.ceil(document.querySelector('.card').getBoundingClientRect().height)+2});
function checks(){const p=$('password').value;return {length:p.length>=8&&p.length<=1024,upper:/\p{Lu}/u.test(p),lower:/\p{Ll}/u.test(p),digit:/[0-9]/.test(p)}}
function emailSuggestion(){const parts=$('email').value.trim().split('@');const replacements={'gmail.co':'gmail.com','gmai.com':'gmail.com','gmial.com':'gmail.com','gmail.con':'gmail.com','hotmail.con':'hotmail.com','outlook.con':'outlook.com'};return parts.length===2&&replacements[parts[1].toLowerCase()]?parts[0]+'@'+replacements[parts[1].toLowerCase()]:''}
function unknownTld(){try{const domain=$('email').value.trim().split('@')[1];return validTlds&&!validTlds.has(new URL('https://'+domain).hostname.split('.').pop().toLowerCase())}catch{return true}}
function errorFor(id){const v=$(id).value;if(id==='email'&&mode==='register'&&unknownTld())return 'Geçerli bir e-posta adresi gir.';if(id==='email'&&mode==='register'&&emailSuggestion())return 'E-posta alan adında yazım hatası olabilir. Önerilen adresi kontrol edip düzelt.';if(id==='email')return !v.trim()?'E-posta adresini gir.':(!/^[^\s@]+@[^\s@]+\.[^\s@.]+$/.test(v.trim())||!$('email').validity.valid?'Geçerli bir e-posta adresi gir.':'');if(id==='password')return !v?'Parolanı gir.':(mode==='register'&&!Object.values(checks()).every(Boolean)?'Parolan aşağıdaki gereksinimlerin tümünü karşılamalı.':'');return !v?'Parolanı tekrar gir.':(v!==$('password').value?'Parolalar eşleşmiyor.':'')}
function validate(){for(const id of ['email','password','confirmation']){const visible=id!=='confirmation'||mode==='register';const show=visible&&(attempted||touched.has(id));const message=show?errorFor(id):'';$(id+'-error').textContent=message;$(id).setAttribute('aria-invalid',String(Boolean(message)))}const suggestion=mode==='register'&&(attempted||touched.has('email'))?emailSuggestion():'';$('email-correction').hidden=!suggestion;$('email-correction').textContent=suggestion?suggestion+' olarak düzelt':'';const rules=checks();document.querySelectorAll('[data-rule]').forEach(el=>el.classList.toggle('ok',rules[el.dataset.rule]));resize()}
function setMode(next){const previous=mode;const card=document.querySelector('.card');const oldHeight=card.getBoundingClientRect().height;mode=next;$('auth-tabs').dataset.mode=mode;attempted=false;touched.clear();$('password').value='';$('confirmation').value='';document.querySelectorAll('[data-password]').forEach(el=>el.type='password');document.querySelectorAll('.visibility').forEach(el=>{el.setAttribute('aria-pressed','false');el.setAttribute('aria-label',el.dataset.for==='confirmation'?'Parola tekrarını göster':'Parolayı göster')});$('heading').textContent=mode==='register'?'Çalışma alanına katıl':'Tekrar hoş geldin';$('lead').textContent=mode==='register'?'Hesabını oluştur, destek asistanını kullanmaya başla.':'Teknik destek çalışma alanına giriş yap.';$('login-tab').setAttribute('aria-selected',String(mode==='login'));$('register-tab').setAttribute('aria-selected',String(mode==='register'));$('confirmation-field').hidden=mode!=='register';$('rules').hidden=mode!=='register';$('password').autocomplete=mode==='register'?'new-password':'current-password';$('submit').textContent=mode==='register'?'Hesap oluştur':'Giriş yap';$('notice').hidden=true;validate();if(previous!==mode&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){$('auth-form').getAnimations().forEach(a=>a.cancel());card.getAnimations().forEach(a=>a.cancel());const newHeight=card.getBoundingClientRect().height;card.animate([{height:oldHeight+'px'},{height:newHeight+'px'}],{duration:260,easing:'cubic-bezier(.22,1,.36,1)'});$('auth-form').animate([{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],{duration:240,easing:'ease-out'})}}
for(const id of ['email','password','confirmation']){$(id).addEventListener('blur',()=>{if($(id).value)touched.add(id);validate()});$(id).addEventListener('input',()=>{if(!busy)$('notice').hidden=true;validate()})}
$('email-correction').onclick=()=>{$('email').value=emailSuggestion();touched.add('email');validate();$('email').focus()};
$('login-tab').onclick=()=>{if(!busy)setMode('login')};$('register-tab').onclick=()=>{if(!busy)setMode('register')};
document.querySelectorAll('.visibility').forEach(button=>button.onclick=()=>{const input=$(button.dataset.for);const show=input.type==='password';input.type=show?'text':'password';button.setAttribute('aria-label',(button.dataset.for==='confirmation'?'Parola tekrarını ':'Parolayı ')+(show?'gizle':'göster'));button.setAttribute('aria-pressed',String(show))});
$('auth-form').addEventListener('submit',event=>{event.preventDefault();if(busy)return;attempted=true;validate();const ids=mode==='register'?['email','password','confirmation']:['email','password'];const invalid=ids.find(id=>errorFor(id));if(invalid){$(invalid).focus();return}busy=true;pendingId=crypto.randomUUID();$('submit').disabled=true;$('submit').textContent=mode==='register'?'Hesabın oluşturuluyor…':'Giriş yapılıyor…';send('streamlit:setComponentValue',{dataType:'json',value:{id:pendingId,mode,email:$('email').value.trim(),password:$('password').value,confirmation:mode==='register'?$('confirmation').value:''}})});
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data.type!=='streamlit:render')return;const args=event.data.args||{};if(Array.isArray(args.tlds))validTlds=new Set(args.tlds);if(lastEpoch!==args.epoch){lastEpoch=args.epoch;setMode('login');$('email').value=args.email||'';$('password').value='';$('confirmation').value=''}if(pendingId&&args.response_id!==pendingId){resize();return}pendingId=null;busy=false;$('submit').disabled=false;$('submit').textContent=mode==='register'?'Hesap oluştur':'Giriş yap';if(args.error||args.notice){$('notice').hidden=false;$('notice').classList.toggle('failure',Boolean(args.error));$('notice').textContent=args.error||args.notice}resize()});
new ResizeObserver(resize).observe(document.querySelector('.card'));
send('streamlit:componentReady',{apiVersion:1});resize();
</script></body></html>
