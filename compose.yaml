services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: servis_masasi
      POSTGRES_USER: servis_app
      POSTGRES_PASSWORD: servis_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
